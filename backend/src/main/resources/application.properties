# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/ride_booking}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:false}

# HTTP and CORS
quarkus.http.host=${HTTP_HOST:0.0.0.0}
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178}
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Brevo SMTP
quarkus.mailer.from=${MAIL_FROM}
quarkus.mailer.host=${MAIL_HOST:smtp-relay.brevo.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${BREVO_USERNAME}
quarkus.mailer.password=${BREVO_SMTP_KEY}
quarkus.mailer.start-tls=${MAIL_START_TLS:REQUIRED}
quarkus.mailer.mock=${MAIL_MOCK:false}
